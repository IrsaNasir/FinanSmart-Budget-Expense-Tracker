 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanSmart - Login</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Background Blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="login-wrapper">
    <div class="login-card">
<div class="sidebar-logo"><svg class="logo-svg" width="26" height="26" viewBox="0 0 32 32" fill="none" style="margin-right:8px;"><path d="M16 2 A14 14 0 1 1 4.2 22.5 L16 16 Z" fill="#10B981"/></svg>Finan<span class="logo-highlight">Smart</span></div>
      <p class="subtitle">Sign in to continue tracking your finances</p>

      <form class="login-form">
        <div class="input-group">
          <label>Email</label>
          <input type="email" placeholder="you@example.com" required>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>

        <div class="form-options">
          <label class="remember"><input type="checkbox"> Remember me</label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <div class="divider"><span>or</span></div>

      <button class="btn-google">Continue with Google</button>

      <p class="signup-text">Don't have an account? <a href="#">Sign Up</a></p>

    </div>
  </div>
  <script>
  const loginForm = document.querySelector('.login-form');

  loginForm.addEventListener('submit', function(e) {
    e.preventDefault();
    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
