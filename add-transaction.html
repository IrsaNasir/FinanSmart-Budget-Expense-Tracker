      </header>

      <section class="content-area">
        <h1>Add Transaction</h1>
        <p>Enter your income or expense details below.</p>

        <div class="add-transaction-card">

          <!-- Type Toggle -->
          <div class="type-toggle">
            <button type="button" class="toggle-btn active" data-type="expense">📉 Expense</button>
            <button type="button" class="toggle-btn" data-type="income">📈 Income</button>
          </div>

          <form id="transactionForm">

            <div class="form-group">
              <label>Amount (Rs)</label>
              <input type="number" id="amount" placeholder="e.g. 2500" required>
            </div>

            <div class="form-group">
              <label>Category</label>
              <select id="category" required>
                <option value="">Select category</option>
                <option value="Food">🍔 Food</option>
                <option value="Shopping">🛒 Shopping</option>
                <option value="Bills">💡 Bills</option>
                <option value="Entertainment">🎬 Entertainment</option>
                <option value="Transport">🚗 Transport</option>
                <option value="Health">🏥 Health</option>
                <option value="Salary">💰 Salary</option>
                <option value="Other">🗂️ Other</option>
              </select>
            </div>

            <div class="form-group">
              <label>Description</label>
              <input type="text" id="description" placeholder="e.g. Grocery shopping" required>
            </div>

            <div class="form-group">
              <label>Date</label>
              <input type="date" id="date" required>
            </div>

            <button type="submit" class="btn-submit">Add Transaction</button>

          </form>

        </div>
      </section>

    </main>

  <script src="JS/add-transaction.js"></script>
